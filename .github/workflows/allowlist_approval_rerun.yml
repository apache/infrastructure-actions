#
# When a review makes the `approval` check pass, re-run the PR's earlier
# failed `approval` run from the `pull_request` event.  The ruleset keeps
# blocking the merge on that stale failure otherwise, even though the
# review-triggered run is green.
#
# A review on a fork PR only gets a read-only token, so the re-run cannot
# happen in allowlist_approval.yml itself.  `workflow_run` runs this file
# from the default branch with the token below; it reads nothing from the
# PR except the head commit SHA, which the script validates.
name: Allowlist Maintainer Approval Re-run

on:
  # Runs default-branch code, reads only the head SHA, and can only re-run
  # the approval workflow's own failed run.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: ["Allowlist Maintainer Approval"]
    types: [completed]

permissions:
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Re-run the stale approval check
        run: python3 scripts/rerun_allowlist_approval.py --repo "${REPO}" --head-sha "${HEAD_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
