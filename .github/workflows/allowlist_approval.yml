#
# Trigger for the allow-list approval gate.  It decides nothing and always
# passes: on every PR event and every review it only wakes up
# allowlist_approval_status.yml, which judges the PR and posts the required
# `approval` commit status (pending while an allow-list PR waits for a
# maintainer, success once approved).
#
# The verdict is not reached here because a fork PR's token is read-only, so
# this run could not post a status, and because this file runs as the PR has
# it, while the status workflow runs from the default branch.
name: Allowlist Maintainer Approval

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

concurrency:
  group: allowlist-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval-trigger:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Hand over to the approval status workflow
        run: echo "allowlist_approval_status.yml posts the 'approval' status for this PR."
