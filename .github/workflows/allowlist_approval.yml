#
# Fails PRs that touch the allow list (actions.yml, approved_patterns.yml or
# the generated Dependabot composite action) until at least one maintainer —
# a reviewer with write access — has approved.  Other PRs pass immediately,
# so the check can be required on every PR.
#
# Re-runs on review events so the status flips as soon as an approval lands
# or is dismissed.
name: Allowlist Maintainer Approval

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: allowlist-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check maintainer approval
        run: python3 scripts/check_allowlist_approval.py --repo "${REPO}" --pr "${PR_NUMBER}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
