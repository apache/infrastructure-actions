name: "PR preview: review overlay on the published site"
description: "Add the review overlay to a site built from the default branch, where a comment opens a new issue"
inputs:
  path:
    description: >-
      Directory holding the built site, annotated with preview-annotate so a
      marked region resolves to its source line
    required: true
  branch:
    description: "Branch the site was built from; issue links point at its source lines"
    required: false
    default: ${{ github.event.repository.default_branch }}
  generated:
    description: >-
      Source-path prefixes, one per line, whose files are not in this
      repository (pages synced from elsewhere). Their lines are not linked.
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Check the site
      shell: bash
      env:
        SITE: ${{ inputs.path }}
      run: |
        if [ ! -d "$SITE" ]; then
          echo "::error::path '$SITE' is not a directory"
          exit 1
        fi

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - name: Inject the review overlay
      shell: bash
      env:
        SITE: ${{ inputs.path }}
        PREVIEW_BRANCH: ${{ inputs.branch }}
        PREVIEW_GENERATED: ${{ inputs.generated }}
        LIB: ${{ github.action_path }}/../lib
      run: node "$LIB/inject-main.mjs" "$SITE"
