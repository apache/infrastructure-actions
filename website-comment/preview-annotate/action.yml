name: "PR preview: annotate the build"
description: "Make a preview build stamp rendered elements with the source file and line they came from"
inputs:
  generator:
    description: "Site generator: jekyll, astro or none"
    required: true
  source:
    description: "jekyll only: the site source directory, holding _config.yml"
    required: false
    default: "."
  production-output:
    description: >-
      Optional: the production build's output directory. The action fails if
      any page in it has an element carrying data-preview-src, which must never
      ship to the live site.
    required: false
    default: ""
outputs:
  vite-plugin:
    description: >-
      astro only: path of the Vite plugin, for the preview build step to pass
      to astro.config as PREVIEW_VITE_PLUGIN
    value: ${{ steps.annotate.outputs.vite-plugin }}
runs:
  using: "composite"
  steps:
    - name: Check the production build carries no preview annotation
      if: inputs.production-output != ''
      shell: bash
      env:
        OUTPUT: ${{ inputs.production-output }}
      run: |
        if [ ! -d "$OUTPUT" ]; then
          echo "::error::production-output '$OUTPUT' is not a directory"
          exit 1
        fi
        # An element carrying the attribute, not the bare word: a page that
        # documents these actions shows it escaped (&lt;p data-preview-src=...)
        # or in prose, and must still build. Each page is matched whole, with
        # line breaks flattened, so a tag split across lines is caught too
        # (portably: BSD grep -z does not let a pattern span lines).
        ATTR='<[A-Za-z][^<>]*[[:space:]]data-preview-src='
        found="$(find "$OUTPUT" -type f \( -iname '*.html' -o -iname '*.htm' \) -exec sh -c '
          for f; do
            if tr "\r\n\t" "   " < "$f" | grep -qE -- "$0"; then printf "%s\n" "$f"; fi
          done
        ' "$ATTR" {} +)"
        if [ -n "$found" ]; then
          echo "::error::data-preview-src found in the production build in $OUTPUT; it must never ship"
          printf '%s\n' "$found" | head -20
          exit 1
        fi

    - name: Switch on source annotation
      id: annotate
      shell: bash
      env:
        GENERATOR: ${{ inputs.generator }}
        SOURCE: ${{ inputs.source }}
        ADAPTERS: ${{ github.action_path }}/../adapters
      run: |
        case "$GENERATOR" in
          jekyll)
            sh "$ADAPTERS/jekyll/prepare.sh" "$SOURCE"
            ;;
          astro)
            # An output rather than GITHUB_ENV: the build step opts in
            # explicitly, and nothing leaks into later steps. See README.md.
            echo "vite-plugin=$ADAPTERS/astro/vite-plugin-preview-src.mjs" >> "$GITHUB_OUTPUT"
            ;;
          none)
            echo "No source annotation: the overlay links to the pull request's Conversation tab"
            ;;
          *)
            echo "::error::generator must be jekyll, astro or none, got '$GENERATOR'"
            exit 1
            ;;
        esac
