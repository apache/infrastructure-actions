# Copy this instead of the check-run example to .github/workflows/fork-ci-status.yml.
# Replace apache/example and pin the action to a reviewed commit before adoption.
name: Fork CI status
on:
  # API metadata only: no checkout, artifacts, caches, or PR code execution.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Fork CI signal]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  statuses: write
  pull-requests: read
# Use the same group for signals and sweeps, and enable only one reporting mode.
concurrency:
  group: fork-ci-status
  cancel-in-progress: false
jobs:
  bridge:
    if: github.repository == 'apache/example'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # Adoption template: replace main with the reviewed release commit.
      - uses: apache/infrastructure-actions/fork-ci@main # zizmor: ignore[unpinned-uses]
        with:
          workflow: ci.yml
          reporting: commit-status
          check-name: CI (fork)
          base-branches: main
          sweep-minutes: '15'
