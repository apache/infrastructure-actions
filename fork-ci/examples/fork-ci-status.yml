# Copy to .github/workflows/fork-ci-status.yml in the adopting repository.
# Replace apache/example and the unreleased action ref before adoption.
name: Fork CI status
on:
  # API metadata only: no checkout, artifacts, caches, or PR code execution.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Fork CI signal]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  checks: write
  pull-requests: read
# Serialize every invocation of this bridge to prevent duplicate checks and
# older observations overwriting newer ones. Keep the same group for all events.
concurrency:
  group: fork-ci-status
  cancel-in-progress: false
jobs:
  bridge:
    if: github.repository == 'apache/example'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # Pin to a reviewed commit after this action is published.
      # Adoption template: no published commit exists yet. Replace this ref.
      - uses: apache/infrastructure-actions/fork-ci@main # zizmor: ignore[unpinned-uses]
        with:
          workflow: ci.yml
          check-name: CI (fork)
          base-branches: main
          sweep-minutes: '15'
