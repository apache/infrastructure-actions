name: Fork CI
description: Mirror a public fork workflow as an informational check on the upstream pull request
inputs:
  github-token:
    description: Upstream GITHUB_TOKEN with checks write, actions read, and pull-requests read
    required: false
    default: ${{ github.token }}
  workflow:
    description: Workflow file name on the fork, such as ci.yml
    required: true
  check-name:
    description: Unique informational check name for this workflow
    default: CI (fork)
  base-branches:
    description: Newline-separated exact base branch names eligible for fork CI
    default: main
  guide-url:
    description: Optional HTTPS contributor setup guide
    default: ''
  recent-hours:
    description: Poll active or missing runs on PRs updated within this many hours (1-168)
    default: '6'
  sweep-size:
    description: Number of eligible PRs per rotating sweep (1-100)
    default: '25'
  sweep-minutes:
    description: Schedule interval in minutes, used to rotate the sweep (5-1440)
    default: '15'
outputs:
  processed:
    description: Number of eligible PRs considered in this invocation
    value: ${{ steps.bridge.outputs.processed }}
  written:
    description: Number of checks created or updated
    value: ${{ steps.bridge.outputs.written }}
  failed:
    description: Number of PRs whose synchronization failed
    value: ${{ steps.bridge.outputs.failed }}
runs:
  using: composite
  steps:
    - name: Mirror fork CI
      id: bridge
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        FORK_CI_ACTION_PATH: ${{ github.action_path }}
        FORK_CI_WORKFLOW: ${{ inputs.workflow }}
        FORK_CI_CHECK_NAME: ${{ inputs.check-name }}
        FORK_CI_BASE_BRANCHES: ${{ inputs.base-branches }}
        FORK_CI_GUIDE_URL: ${{ inputs.guide-url }}
        FORK_CI_RECENT_HOURS: ${{ inputs.recent-hours }}
        FORK_CI_SWEEP_SIZE: ${{ inputs.sweep-size }}
        FORK_CI_SWEEP_MINUTES: ${{ inputs.sweep-minutes }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { bridge } = require(`${process.env.FORK_CI_ACTION_PATH}/bridge.cjs`);
          const counts = await bridge({ github, context, core });
          for (const [key, value] of Object.entries(counts)) core.setOutput(key, value);
