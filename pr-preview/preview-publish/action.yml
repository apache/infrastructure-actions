name: "PR preview: publish and retire previews"
description: "Publish armed pull requests' preview sites to ASF staging, and retire the rest"
inputs:
  site-name:
    description: >-
      First label of the staging hostname, as ASF staging derives it from the
      repository: apache/foo-site stages at foo-pr<N>.staged.apache.org, so
      this is "foo".
    required: true
  build-workflow:
    description: "File name of the workflow that runs preview-artifact"
    required: false
    default: "build.yml"
  pr:
    description: "Publish only this pull request now, skipping the /show-preview check. Leave empty on schedule."
    required: false
    default: ""
  reap-head-branches:
    description: >-
      "true" to also delete this repository's branches whose pull requests have
      all closed. Off by default; preview/* branches are always retired.
    required: false
    default: "false"
  token:
    description: "Token with contents, pull-requests and issues write, and actions read"
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: Refuse to run from a pull-request event
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # This step holds a token that can push and comment. It consumes
        # artifacts; it must never run where pull-request code could.
        case "$EVENT_NAME" in
          schedule|workflow_dispatch) ;;
          *) echo "::error::preview-publish runs on schedule or workflow_dispatch only, got '$EVENT_NAME'"; exit 1 ;;
        esac

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - name: Publish and retire previews
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PREVIEW_SITE_NAME: ${{ inputs.site-name }}
        PREVIEW_BUILD_WORKFLOW: ${{ inputs.build-workflow }}
        PREVIEW_REAP_HEAD_BRANCHES: ${{ inputs.reap-head-branches }}
        PR_INPUT: ${{ inputs.pr }}
        LIB: ${{ github.action_path }}/../lib
      run: |
        if [ -n "$PR_INPUT" ]; then
          node "$LIB/publish.mjs" --pr "$PR_INPUT"
        else
          node "$LIB/publish.mjs"
        fi
